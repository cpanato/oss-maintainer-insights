name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"

permissions: {}

concurrency:
  group: scorecard-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard
    if: github.repository == 'cpanato/oss-maintainer-insights'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read # Read repository contents and settings
      actions: read # Inspect workflow runs and token permissions
      issues: read # Read issues for maintenance checks
      pull-requests: read # Read pull requests for code review checks
      checks: read # Read check runs for CI test checks

    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Analyze repository practices
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-report
          path: results.sarif
          retention-days: 7
          if-no-files-found: error
