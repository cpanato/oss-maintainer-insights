name: Repository snapshots and Pages

# Manual refresh is operational: it consumes API allowance and regenerates saved UI data.
# PRs run offline collector fixtures in CI; live collection must leave API allowance for publication.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - catalog/**
      - cmd/collector/**
      - internal/**
      - schemas/**
      - .go-version
      - go.mod
      - go.sum
      - .github/workflows/snapshots.yml
      - apps/web/**
      - packages/**
      - package.json
      - package-lock.json
      - scripts/**
      - diagnostics/**
  schedule:
    - cron: "43 * * * *"

permissions: {}

env:
  GOTOOLCHAIN: local

concurrency:
  group: snapshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: Generate saved repository samples
    if: github.repository == 'cpanato/oss-maintainer-insights'
    runs-on: ubuntu-latest
    timeout-minutes: 105 # 90-minute cohort deadline, five-minute history, and setup/artifact margin.
    outputs:
      data-base-revision: ${{ steps.restore.outputs.revision }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false

      - name: Restore saved data and checkpoints from the data branch
        id: restore
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated-data .cache/snapshots .data-source
          source scripts/snapshot-publication-common.sh
          snapshot_read_refs
          if [[ -n "$snapshot_data" ]]; then
            snapshot_git fetch "$snapshot_remote" refs/heads/data
            revision=$(git rev-parse FETCH_HEAD)
            snapshot_output revision "$revision"
            git archive "$revision" | tar -x -C .data-source
            if [[ -d .data-source/snapshots ]]; then cp -a .data-source/snapshots/. generated-data/; fi
            if [[ -d .data-source/checkpoints ]]; then cp -a .data-source/checkpoints/. .cache/snapshots/; fi
          else
            snapshot_output revision ''
          fi

      - name: Collect bounded public samples in Go
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COLLECTION_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$COLLECTION_EVENT" == 'workflow_dispatch' ]]; then
            flags+=(--force)
          fi
          go run ./cmd/collector snapshots --output generated-data --state .cache/snapshots "${flags[@]}"

      - name: Resume historical review backfill in Go
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # A separate small budget leaves current creation cohorts first priority.
        run: go run ./cmd/collector history --output generated-data/history --state .cache/snapshots/history --requests=100

      - name: Upload public aggregate samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repository-snapshots
          path: generated-data/
          retention-days: 7
          if-no-files-found: error

      - name: Upload internal sanitized conditional checkpoints
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-checkpoints
          path: .cache/snapshots/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

  publish-data:
    name: Save datasets on the data branch
    needs: collect
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.save.outputs.revision }}
      current: ${{ steps.save.outputs.current }}

    permissions:
      contents: write # Commit only generated JSON and sanitized collector checkpoints to data.

    steps:
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download public samples
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository-snapshots
          path: generated-data

      - name: Download sanitized checkpoints
        continue-on-error: true # A cold or failed collection can have no checkpoint artifact.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-checkpoints
          path: .cache/snapshots

      - name: Commit data atomically without replacing newer source builds
        id: save
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          DATA_BASE_REVISION: ${{ needs.collect.outputs.data-base-revision }}
        shell: bash
        run: |
          bash scripts/publish-snapshots.sh

  build-pages:
    name: Build Pages with public snapshots
    needs: publish-data
    if: needs.publish-data.outputs.current == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download public samples only
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repository-snapshots
          path: apps/web/public/data

      - name: Build static website
        run: npm run build

      - name: Record and validate artifact provenance
        env:
          SOURCE_REVISION: ${{ github.sha }}
          DATA_REVISION: ${{ needs.publish-data.outputs.revision }}
        run: node scripts/check-site.mjs --manifest

      - name: Package public Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/dist

  deploy-pages:
    name: Deploy GitHub Pages
    needs: [build-pages, publish-data]
    runs-on: ubuntu-latest
    timeout-minutes: 80 # Up to 65 minutes for quota, ten for Pages, plus setup margin.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read # Read the revision guard script from the source build.
      pages: write # Publish the validated public website artifact.
      id-token: write # Authenticate the default-branch Pages deployment.

    steps:
      - name: Checkout source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for deployment API allowance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/wait-pages-quota.sh

      - name: Verify Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Reject superseded source or data revisions
        id: guard
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ github.sha }}
          DATA_REVISION: ${{ needs.publish-data.outputs.revision }}
        run: bash scripts/check-snapshot-revisions.sh

      - name: Deploy public website
        id: deployment
        if: steps.guard.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
